name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb openbox xterm x11-utils \
            at-spi2-core dbus-x11 \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 libgtk-3-0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: cargo check
        run: cargo check --all-targets --workspace

      - name: cargo build
        run: cargo build --release

      - name: Verify test environment
        run: |
          echo "=== X11 / display tools ==="
          Xvfb -version || true
          xterm -version || true
          echo "=== Python GTK availability ==="
          python3 -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('Gtk3 OK')" || true
          echo "=== DBus session ==="
          dbus-run-session -- bash -c 'echo DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS'
          echo "=== Existing DISPLAYs ==="
          ls -la /tmp/.X11-unix/ || true

      - name: cargo test
        env:
          RUST_BACKTRACE: 1
        run: dbus-run-session -- cargo test --all-targets --workspace -- --nocapture 2>&1 | tee cargo-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-log
          path: cargo-test.log
          retention-days: 7

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        run: |
          PKG_VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Build wheel
        run: |
          python -m pip install build wheel
          python -m build --wheel

      - name: Retag wheel to the binary's actual glibc requirement
        run: |
          MAX=$(objdump -T target/release/linux-x11-harness \
            | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 | cut -d_ -f2)
          MAX=${MAX//./_}   # GLIBC_2.34 -> manylinux_2_34 (PEP 600 uses underscores)
          echo "binary requires glibc >= ${MAX//_/.}"
          # Plain rename: the 'wheel tags' CLI mangles the platform tag when
          # reassembling the filename.
          for f in dist/*.whl; do
            base=$(basename "$f")
            mv "dist/$base" "dist/${base/linux_x86_64/manylinux_${MAX}_x86_64}"
          done
          ls dist/

      - name: Bundle standalone binary
        run: |
          mkdir -p bundle/linux-x11-harness
          cp target/release/linux-x11-harness bundle/linux-x11-harness/
          cp -r skills/linux-x11-harness bundle/linux-x11-harness/skill
          tar -czf "linux-x11-harness-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" -C bundle .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            linux-x11-harness-*-x86_64-linux.tar.gz
          generate_release_notes: true
